<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PGINHS Student Portal</title>

<style>
/* Body with dark blue background */
body { 
  margin: 0;
  font-family: Arial, sans-serif;
  height: 100vh;
  display: flex; 
  justify-content: center; 
  align-items: center; 
  background: #0a1f44;
  overflow: hidden;
}

/* Wrapper for arch */
.wrapper {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* Decorative arch */
.wrapper::before {
  content: "";
  position: absolute;
  top: -80px;
  width: 220px;
  height: 100px;
  background: #0a1f44;
  border-radius: 50% 50% 0 0;
  border: 6px solid #FFA500;
  box-shadow: 0 0 15px rgba(255,165,0,0.5);
  z-index: 2;
}

/* Main portal container */
.container { 
  position: relative;
  z-index: 1;
  background: linear-gradient(135deg, #FFF8B5, #B3D9FF); /* pastel gradient */
  padding: 50px 30px; 
  border-radius: 25px; 
  box-shadow: 0 15px 35px rgba(0,0,0,0.35); 
  width: 100%;
  max-width: 400px;
  text-align: center;
  color: #0a1f44;
  box-sizing: border-box;
}

/* Title */
h2 { 
  margin-bottom: 30px; 
  font-size: 28px; 
  font-weight: bold; 
}

/* Inputs */
input { 
  width: 90%; 
  padding: 15px; 
  margin: 12px auto; 
  border-radius: 12px; 
  border: 1px solid #0a1f44;
  font-size: 16px;
  text-align: center;
  display: block;
}

/* Buttons */
button { 
  width: 90%; 
  padding: 15px; 
  margin: 12px auto; 
  border-radius: 12px; 
  border: 2px solid #0a1f44;
  background: linear-gradient(45deg, #A2D5F2, #FFF5BA);
  color: #0a1f44;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 6px 18px rgba(0,0,0,0.25);
  transition: all 0.25s ease;
  display: block;
}
button:hover {
  background: linear-gradient(45deg, #8AC4E9, #FFF1A8);
  transform: translateY(-2px);
}

/* Toggle link */
.switch { 
  margin-top: 15px;
  cursor: pointer; 
  color: #0a1f44; 
  font-weight: bold; 
}
.switch:hover { 
  text-decoration: underline; 
}

/* MOBILE RESPONSIVE */
@media screen and (max-width: 400px){
  .container { padding: 40px 20px; }
  input, button { padding: 14px; font-size: 16px; }
  h2 { font-size: 26px; }
}
</style>
</head>
<body>

<div class="wrapper">
  <div class="container">
    <h2>Welcome to PGINHS Portal</h2>
    <input type="text" placeholder="Student ID">
    <input type="password" placeholder="Password">
    <button>Access Portal</button>
    <p class="switch">Forgot your password?</p>
  </div>
</div>

</body>
</html>
