<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PGINHS Student Login / Sign Up</title>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
body { 
  font-family: Arial, sans-serif; 
  background: #0a1f44; 
  display: flex; 
  justify-content: center; 
  align-items: center; 
  height: 100vh; 
  margin: 0; 
  padding: 10px; 
}

.container { 
  background: linear-gradient(135deg, #FFF8B5, #B3D9FF); 
  padding: 50px 30px; 
  border-radius: 25px; 
  box-shadow: 0 15px 35px rgba(0,0,0,0.35); 
  width: 100%; 
  max-width: 420px; 
  text-align: center; 
  color: #0a1f44; 
  box-sizing: border-box; 
}

.profile-pic {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  object-fit: cover;
  margin-bottom: 25px;
  border: 3px solid #0a1f44;
}

h2 { 
  margin-bottom: 25px; 
  font-size: 28px; 
  font-weight: bold; 
}

input { 
  width: 90%; 
  padding: 15px; 
  margin: 12px auto; 
  border-radius: 12px; 
  border: 1px solid #0a1f44; 
  font-size: 16px; 
  text-align: center; 
  display: block; 
  background: rgba(255,255,255,0.9); 
  color: #0a1f44;
}

button { 
  width: 90%; 
  padding: 15px; 
  margin: 12px auto; 
  border-radius: 12px; 
  border: 2px solid #0a1f44; 
  background: linear-gradient(45deg, #A2D5F2, #FFF5BA); 
  color: #0a1f44; 
  font-weight: bold; 
  cursor: pointer; 
  box-shadow: 0 6px 18px rgba(0,0,0,0.25); 
  transition: all 0.25s ease; 
  display: block; 
}
button:hover { 
  background: linear-gradient(45deg, #8AC4E9, #FFF1A8); 
  transform: translateY(-2px); 
}

.switch { 
  text-align: center; 
  margin-top: 15px; 
  cursor: pointer; 
  color: #0a1f44; 
  font-weight: bold; 
}
.switch:hover { 
  text-decoration: underline; 
}

@media screen and (max-width: 400px){
  .container { padding: 40px 20px; }
  input, button { padding: 14px; font-size: 16px; }
  h2 { font-size: 26px; }
  .profile-pic { width: 100px; height: 100px; }
}
</style>
</head>
<body>

<div class="container" id="authContainer">
  <!-- Stacked documents icon -->
  <img src="https://cdn-icons-png.flaticon.com/512/2991/2991148.png" alt="Documents Icon" class="profile-pic">

  <h2 id="formTitle">Student Login</h2>
  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Password">
  <button id="actionButton">Login</button>
  <p class="switch" id="toggleForm">Don't have an account? Sign Up</p>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAal-tUtavmqhKDGfY5ETXTanvBoieN304",
  authDomain: "student-document-request-4cd93.firebaseapp.com",
  projectId: "student-document-request-4cd93",
  storageBucket: "student-document-request-4cd93.appspot.com",
  messagingSenderId: "646537888403",
  appId: "1:646537888403:web:b9c8826a2ae92f073f4366",
  measurementId: "G-TQQ8779L4G"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let formState = "login";
const formTitle = document.getElementById("formTitle");
const actionButton = document.getElementById("actionButton");
const toggleForm = document.getElementById("toggleForm");

toggleForm.addEventListener("click", () => {
  if(formState === "login"){
    formState = "signup";
    formTitle.innerText = "Student Sign Up";
    actionButton.innerText = "Sign Up";
    toggleForm.innerText = "Already have an account? Login";
  } else {
    formState = "login";
    formTitle.innerText = "Student Login";
    actionButton.innerText = "Login";
    toggleForm.innerText = "Don't have an account? Sign Up";
  }
});

function generateTrackingNumber() {
  const randomDigits = Math.floor(1000 + Math.random() * 9000);
  const year = new Date().getFullYear();
  return `PG-${year}-${randomDigits}`;
}

actionButton.addEventListener("click", () => {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  if(formState === "login"){
    auth.signInWithEmailAndPassword(email, password)
    .then(async userCredential => {
      const user = userCredential.user;
      const doc = await db.collection("users").doc(user.uid).get();
      if(doc.exists){
        const trackingNumber = doc.data().trackingNumber;
        alert(`Login Successful! Your tracking number: ${trackingNumber}`);
      } else {
        alert("Login Successful!");
      }
      window.location.href = "https://pginhsrequest.github.io/profile/";
    })
    .catch(error => {
      alert("Login Failed: " + error.message);
    });
  } else {
    auth.createUserWithEmailAndPassword(email, password)
    .then(async userCredential => {
      const user = userCredential.user;
      const trackingNumber = generateTrackingNumber();
      await db.collection("users").doc(user.uid).set({
        email: email,
        trackingNumber: trackingNumber,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      alert(`Account Created! Your tracking number is: ${trackingNumber}`);
      auth.signInWithEmailAndPassword(email, password)
      .then(() => {
        window.location.href = "https://pginhsrequest.github.io/profile/";
      });
    })
    .catch(error => {
      alert("Sign Up Failed: " + error.message);
    });
  }
});
</script>

</body>
</html>
