<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PGINHS Student Portal</title>

<style>
/* Body with dark blue and gray gradient, subtle starry vibe */
body { 
  margin: 0;
  font-family: Arial, sans-serif;
  height: 100vh;
  display: flex; 
  justify-content: center; 
  align-items: center; 
  background: linear-gradient(135deg, #0a1f44, #3a3a3a);
  overflow: hidden;
  position: relative;
  color: #FFD700; /* golden yellow for text accents */
}

/* Star layer */
.stars {
  position: absolute;
  width: 200%;
  height: 200%;
  background: transparent;
  z-index: 0;
  pointer-events: none;
}

.star {
  position: absolute;
  width: 2px;
  height: 2px;
  background: #FFD700; /* golden yellow stars */
  border-radius: 50%;
  opacity: 0.7;
}

/* Main container */
.container { 
  position: relative;
  z-index: 1;
  background: linear-gradient(135deg, #1E3A5F, #FFD700); /* dark blue to golden yellow */
  padding: 50px 30px; 
  border-radius: 20px; 
  box-shadow: 0 10px 30px rgba(0,0,0,0.4); 
  width: 100%;
  max-width: 420px;
  text-align: center;
  color: #0a1f44; /* dark text on light container */
  box-sizing: border-box;
}

/* Title */
h2 { 
  margin-bottom: 30px; 
  font-size: 30px; 
  font-weight: bold; 
}

/* Inputs & Buttons */
input, button { 
  width: 100%; 
  padding: 16px; 
  margin: 12px 0; 
  border-radius: 10px; 
  border: none; 
  box-sizing: border-box; 
  font-size: 18px;
}

input { 
  background: rgba(255,255,255,0.9); 
  color: #0a1f44; 
  text-align: center;
}

/* Gradient buttons using your color palette */
button { 
  background: linear-gradient(45deg, #1E3A5F, #FFD700); 
  color: #0a1f44; 
  cursor: pointer; 
  transition: all 0.2s ease; 
  font-weight: bold;
  box-shadow: 0 5px 15px rgba(0,0,0,0.2);
}

button:hover { 
  background: linear-gradient(45deg, #FFD700, #1E3A5F);
  transform: translateY(-2px);
}

/* Toggle link */
.switch { 
  text-align: center; 
  margin-top: 20px; 
  cursor: pointer; 
  color: #0a1f44; 
  font-weight: bold; 
}
.switch:hover { 
  text-decoration: underline; 
}

/* Mobile responsiveness */
@media screen and (max-width: 400px){
  .container { padding: 40px 20px; }
  input, button { padding: 14px; font-size: 16px; }
  h2 { font-size: 26px; }
}
</style>
</head>
<body>

<!-- Stars layer -->
<div class="stars" id="starsContainer"></div>

<div class="container">
  <h2>Welcome to PGINHS Portal</h2>
  <input type="text" placeholder="Student ID">
  <input type="password" placeholder="Password">
  <button>Access Portal</button>
  <p class="switch">Forgot your password?</p>
</div>

<script>
// Generate stars dynamically
const starsContainer = document.getElementById("starsContainer");
const starCount = 150;
for (let i = 0; i < starCount; i++) {
  const star = document.createElement("div");
  star.classList.add("star");
  star.style.top = Math.random() * 200 + "vh";
  star.style.left = Math.random() * 200 + "vw";
  star.style.width = Math.random() * 3 + 1 + "px";
  star.style.height = star.style.width;
  star.style.opacity = Math.random() * 0.8 + 0.2;
  starsContainer.appendChild(star);
}
</script>

</body>
</html>
